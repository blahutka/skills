<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{REPORT_TITLE}}</title>
  <style>
    :root {
      --ink: #172033;
      --muted: #667085;
      --line: #dde3ec;
      --paper: #ffffff;
      --canvas: #f3f6fa;
      --accent: #315fc6;
      --confirmed-bg: #eaf8ef;
      --confirmed-ink: #17663a;
      --candidate-bg: #eef3ff;
      --candidate-ink: #3658a6;
      --proposal-bg: #f3edff;
      --proposal-ink: #6941a5;
      --open-bg: #fff6e5;
      --open-ink: #875a12;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--canvas); color: var(--ink); font: 16px/1.55 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    a { color: var(--accent); }
    .shell { display: grid; grid-template-columns: 250px minmax(0, 920px); gap: 28px; max-width: 1240px; margin: 0 auto; padding: 30px 24px 64px; }
    aside { position: sticky; top: 20px; align-self: start; }
    .brand { margin-bottom: 20px; }
    .eyebrow { color: var(--accent); font-size: .75rem; font-weight: 800; letter-spacing: .09em; text-transform: uppercase; }
    nav { background: var(--paper); border: 1px solid var(--line); border-radius: 14px; padding: 12px; box-shadow: 0 10px 30px rgba(23,32,51,.06); }
    nav a { display: block; padding: 8px 10px; border-radius: 8px; color: var(--ink); text-decoration: none; font-size: .9rem; }
    nav a:hover { background: #f0f4fb; }
    main { min-width: 0; }
    header, section { background: var(--paper); border: 1px solid var(--line); border-radius: 16px; padding: 26px; margin-bottom: 18px; box-shadow: 0 12px 34px rgba(23,32,51,.06); }
    h1 { margin: 5px 0 8px; font-size: clamp(2rem, 5vw, 3.35rem); line-height: 1.05; }
    h2 { margin: 0 0 16px; font-size: 1.35rem; }
    h3 { margin: 20px 0 8px; font-size: 1.05rem; }
    .lede { color: var(--muted); max-width: 72ch; font-size: 1.08rem; }
    .meta { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; }
    .badge { display: inline-flex; align-items: center; border-radius: 999px; padding: 4px 9px; font-size: .75rem; font-weight: 750; }
    .confirmed { background: var(--confirmed-bg); color: var(--confirmed-ink); }
    .candidate { background: var(--candidate-bg); color: var(--candidate-ink); }
    .proposal { background: var(--proposal-bg); color: var(--proposal-ink); }
    .open { background: var(--open-bg); color: var(--open-ink); }
    .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
    .card { border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
    .card > :first-child { margin-top: 0; }
    table { width: 100%; border-collapse: collapse; font-size: .92rem; }
    th, td { padding: 11px 10px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
    th { color: var(--muted); font-size: .75rem; letter-spacing: .04em; text-transform: uppercase; }
    pre { overflow-x: auto; margin: 12px 0 0; padding: 16px; border-radius: 11px; background: #101828; color: #dbe7ff; font: .86rem/1.55 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .flow { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
    .step { border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; background: #fbfcfe; }
    .arrow { color: var(--muted); font-weight: 800; }
    .decision { border-left: 4px solid var(--accent); padding: 10px 14px; background: #f7f9fd; border-radius: 0 10px 10px 0; }
    @media (max-width: 820px) {
      .shell { grid-template-columns: 1fr; padding: 16px; }
      aside { position: static; }
      nav { display: flex; overflow-x: auto; }
      nav a { white-space: nowrap; }
      header, section { padding: 20px; }
    }
    @media print {
      body { background: white; }
      .shell { display: block; max-width: none; padding: 0; }
      aside { display: none; }
      header, section { box-shadow: none; break-inside: avoid; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <aside>
      <div class="brand">
        <div class="eyebrow">Domain discovery</div>
        <strong>{{REPORT_TITLE}}</strong>
      </div>
      <nav aria-label="Report sections">
        {{NAVIGATION_LINKS}}
      </nav>
    </aside>

    <main>
      <header>
        <div class="eyebrow">{{REPORT_MODE}}</div>
        <h1>{{REPORT_TITLE}}</h1>
        <p class="lede">{{REPORT_SUMMARY}}</p>
        <div class="meta">{{STATUS_BADGES}}</div>
      </header>

      {{REPORT_SECTIONS}}
    </main>
  </div>
</body>
</html>
